<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f7b955"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d111c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Outer ring -->
  <rect x="4" y="4" width="120" height="120" rx="24" stroke="url(#lg)" stroke-width="2" opacity="0.3"/>
  <!-- Center gradient square -->
  <rect x="36" y="36" width="56" height="56" rx="14" fill="url(#lg)" opacity="0.9"/>
  <!-- Inner glow -->
  <rect x="44" y="44" width="40" height="40" rx="10" fill="white" opacity="0.15"/>
  <!-- Orbiting dots -->
  <circle cx="64" cy="64" r="4" fill="white"/>
  <circle cx="80" cy="48" r="2" fill="white" opacity="0.7"/>
  <circle cx="48" cy="80" r="2" fill="white" opacity="0.5"/>
  <circle cx="52" cy="44" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="76" cy="76" r="1.5" fill="white" opacity="0.3"/>
  <!-- Stellar sparkle -->
  <path d="M64 28 L66 38 L64 34 L62 38 Z" fill="url(#lg)" opacity="0.5"/>
</svg>
