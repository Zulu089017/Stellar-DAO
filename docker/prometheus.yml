# Prometheus configuration for Stellar Payment Gateway
# Scrapes the API health/metrics endpoint and PostgreSQL metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: stellar-payment-gateway

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'stellar-payment-gateway-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:4000']
        labels:
          service: 'stellar-payment-gateway-api'
          env: 'production'

  - job_name: 'stellar-payment-gateway-postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'stellar-payment-gateway-postgres'
          env: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
