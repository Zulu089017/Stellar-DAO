# GitHub Labels — synced via micnncim/action-label-syncer
#
# Edit this file, push to main, and the labels workflow syncs them.
# Color codes from github-label-sync's default palette.

# ── Conventional Commit type labels ─────────────────────────────
- name: 'feat'
  color: '0e8a16'
  description: 'New feature or enhancement'
- name: 'fix'
  color: 'd73a4a'
  description: 'Bug fix'
- name: 'perf'
  color: 'f9d0c4'
  description: 'Performance improvement'
- name: 'refactor'
  color: 'fbca04'
  description: 'Code refactor (no feature change, no bug fix)'
- name: 'docs'
  color: '0075ca'
  description: 'Documentation only changes'
- name: 'test'
  color: 'c5def5'
  description: 'Adding or updating tests'
- name: 'build'
  color: 'bfdadc'
  description: 'Build system or external dependencies'
- name: 'ci'
  color: 'bfd4f2'
  description: 'CI configuration changes'
- name: 'chore'
  color: 'd4c5f9'
  description: 'Maintenance tasks'

# ── Priority / status labels ────────────────────────────────────
- name: 'breaking'
  color: 'b60205'
  description: 'Breaking change — requires major version bump'
- name: 'blocked'
  color: 'e11d21'
  description: 'Blocked by another issue or PR'
- name: 'needs-review'
  color: 'fef2c0'
  description: 'Ready for reviewer attention'
- name: 'triage'
  color: 'fbca04'
  description: 'Needs triage by maintainers'

# ── Scope labels ────────────────────────────────────────────────
- name: 'contracts'
  color: '5319e7'
  description: 'Soroban smart contracts (Rust)'
- name: 'api'
  color: '1d76db'
  description: 'Fastify REST + SSE API'
- name: 'web'
  color: '0e8a16'
  description: 'Next.js dashboard'
- name: 'relayer'
  color: '006b75'
  description: 'Cross-chain relayer service'
- name: 'sdk'
  color: '0052cc'
  description: 'TypeScript SDK package'
- name: 'shared'
  color: 'c5def5'
  description: 'Shared types and utilities'
- name: 'ui'
  color: 'f9d0c4'
  description: 'UI component package'
- name: 'docker'
  color: '384d54'
  description: 'Docker and container config'
- name: 'github'
  color: '444444'
  description: 'GitHub Actions, templates, config'

# ── Complexity labels (for grant/bounty platforms) ──────────────
- name: 'trivial'
  color: '0e8a16'
  description: 'Simple fix — good first issue (100 pts)'
- name: 'medium'
  color: 'fbca04'
  description: 'Moderate complexity (150 pts)'
- name: 'high'
  color: 'b60205'
  description: 'Complex feature or refactor (200 pts)'

# ── Type labels ─────────────────────────────────────────────────
- name: 'bug'
  color: 'd73a4a'
  description: 'Something is broken'
- name: 'enhancement'
  color: 'a2eeef'
  description: 'New feature or improvement request'
- name: 'question'
  color: 'd876e3'
  description: 'Further information requested'
- name: 'duplicate'
  color: 'cfd3d7'
  description: 'Already reported or fixed elsewhere'
- name: 'wontfix'
  color: 'ffffff'
  description: 'Will not be addressed'
- name: 'dependencies'
  color: '0366d6'
  description: 'Dependency update (Dependabot)'
