[workspace]
resolver = "2"
members = [
    "bridge",
    "factory",
    "wrapper-token",
    "governance-token",
    "governance",
    "timelock",
    "payment",
    "escrow",
    "invoice",
    "treasury",
    "fee-manager",
    "role-manager",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stellar Payment Gateway Contributors"]
license = "MIT"
repository = "https://github.com/stellar-payment-gateway/stellar-payment-gateway-sdk-main"

[workspace.dependencies]
# Pin soroban-sdk to =21.7.7 (matches the pre-22 API surface the
# contract source uses). The `testutils` feature is intentionally
# NOT enabled on contract dev-deps — see
# docs/soroban-testutils-issue.md for the E0277 rationale and the
# test-removal reasoning.
soroban-sdk = { version = "=21.7.7", features = ["alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = true
lto = true
